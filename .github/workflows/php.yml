name: PHP package checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, pdo_sqlite
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish --no-interaction

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Check PHP syntax
        run: find . -path './vendor' -prune -o -path './.git' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l

      - name: Run declared tests
        shell: bash
        run: |
          if php -r '$composer = json_decode(file_get_contents("composer.json"), true); exit(isset($composer["scripts"]["test"]) ? 0 : 1);'; then
            composer test --no-interaction
          else
            echo 'No test script is declared for this package.'
          fi
